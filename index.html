<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GreenTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-4xl mx-auto flex-row-reverse">
        <div class="font-bold text-xl text-green-600">GreenTrack 🌿</div>
        <button id="lang-toggle" class="bg-white border px-4 py-1 rounded-full text-sm">English</button>
    </nav>

    <div id="auth-container" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border">
        <h1 class="text-xl font-bold text-center mb-6" id="text-title">سجل دخولك</h1>
        <form id="auth-form" class="space-y-4">
            <input type="email" id="auth-email" required class="w-full p-3 border rounded-xl" placeholder="البريد الإلكتروني">
            <input type="password" id="auth-password" required class="w-full p-3 border rounded-xl" placeholder="كلمة المرور">
            <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-3 rounded-xl">تسجيل الدخول</button>
        </form>
    </div>

    <script>
        // 1. التهيئة (مرة واحدة فقط)
        const SUPABASE_URL = 'https://slunnljduvspmghgzrlc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsdW5ubGpkdXZzcG1naGd6cmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTUxMDEsImV4cCI6MjA5Njc5MTEwMX0.LzNMNL4wKKCQFKds3_H3boc0FMPNX2qz646_eEfA-Pk';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. منطق اللغة
        const langToggle = document.getElementById('lang-toggle');
        let isArabic = true;

        langToggle.addEventListener('click', () => {
            isArabic = !isArabic;
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            langToggle.innerText = isArabic ? 'English' : 'عربي';
            document.getElementById('text-title').innerText = isArabic ? 'سجل دخولك' : 'Sign In';
            document.getElementById('auth-email').placeholder = isArabic ? 'البريد الإلكتروني' : 'Email';
            document.getElementById('auth-password').placeholder = isArabic ? 'كلمة المرور' : 'Password';
            document.getElementById('submit-btn').innerText = isArabic ? 'تسجيل الدخول' : 'Sign In';
        });

        // 3. تسجيل الدخول
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('خطأ: ' + error.message);
            } else {
                alert("تم تسجيل الدخول بنجاح!");
            }
        });
    </script>
</body>
</html>

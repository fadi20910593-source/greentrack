<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولّد الـ QR الذكي للمزارع</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f9f4; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        button { background-color: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #1b5e20; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>نظام GreenTrack الذكي 🌿</h2>
        <p>اضغط على الزر لتوليد رمز QR لوصلة شجرة تجريبية:</p>
        
<button onclick="saveTreeToDatabase('زيتون نبالي', 'ترقيد هوائي', 'تجربة أولى ناجحة سحابياً')">توليد الـ QR Code الآن</button>        
        <div id="qrcode"></div>
    </div>

    <script>
        function generateMyQR() {
            // تنظيف أي كود قديم
            document.getElementById("qrcode").innerHTML = "";
            
            // رابط وهمي لشجرة ليمون تجريبية يحمل رقم معرف فريد
            let demoTreeURL = "https://greentrack.com/scan/tree-lemon-001";
            
            // تشغيل المكتبة لتوليد الكود
            new QRCode(document.getElementById("qrcode"), {
                text: demoTreeURL,
                width: 180,
                height: 180,
                colorDark : "#1b5e20", // لون الـ QR أخضر زراعي
                colorLight : "#ffffff"
            });
        }
    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // بيانات مشروع GreenTrack الخاصة بك
  const SUPABASE_URL = 'https://slunnljduvspmghgzrlc.supabase.co';
  
  // المفتاح العام الصحيح الخاص بك (قم بنسخه بالكامل عبر الزر في المتصفح إذا لم يكن كاملاً أدناه)
  const SUPABASE_ANON_KEY = 'sb_publishable_TcEUmD0fKlopTF2MgnQu4g_nf9ui0vs';

  // استخدام اسم متغير فريد لمنع تكرار التعريف والتضارب
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function saveTreeToDatabase(treeType, method, notes) {
    const { data, error } = await supabaseClient
      .from('trees')
      .insert([
        { 
          tree_type: treeType, 
          grafting_method: method, 
          notes: notes 
        }
      ])
      .select();

    if (error) {
      console.error('خطأ في حفظ البيانات:', error.message);
      alert('حدث خطأ أثناء الحفظ في السيرفر: ' + error.message);
    } else {
      console.log('تم حفظ الشجرة بنجاح في السيرفر السحابي!', data);
      const treeId = data[0].id;
      const qrUrl = `https://fadi20910593-source.github.io/greentrack/?id=${treeId}`;
      
      // التحقق من وجود دالة توليد الـ QR لعرضها على الشاشة
      if (typeof generateMyQR === "function") {
         generateMyQR(qrUrl);
      } else {
         alert("تم الحفظ بنجاح! رابط الـ QR الفريد هو: " + qrUrl);
      }
    }
  }
</script>
</body>
</html>

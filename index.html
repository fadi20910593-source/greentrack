<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <title>GreenTrack - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap'); body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-4xl mx-auto flex-row-reverse">
        <div class="flex items-center gap-2 text-green-600 font-bold text-xl">GreenTrack 🌿</div>
        <button id="lang-toggle" class="bg-white border px-4 py-1 rounded-full text-sm">English</button>
    </nav>

    <div id="auth-container" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border">
        <h1 class="text-xl font-bold text-center mb-6" id="text-title">سجل دخولك</h1>
        <form id="auth-form" class="space-y-4">
            <input type="email" id="auth-email" required class="w-full p-3 border rounded-xl" placeholder="البريد الإلكتروني">
            <input type="password" id="auth-password" required class="w-full p-3 border rounded-xl" placeholder="كلمة المرور">
            <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-3 rounded-xl">تسجيل الدخول</button>
        </form>
    </div>

    <div id="dashboard" class="hidden max-w-4xl mx-auto p-6">
        <div class="bg-white p-6 rounded-2xl shadow border">
            <h2 class="text-2xl font-bold mb-4">قائمة الأشجار الخاصة بك</h2>
            <table class="w-full text-right border-collapse">
                <thead><tr class="border-b"><th class="py-2">اسم الشجرة</th><th class="py-2">الموقع</th></tr></thead>
                <tbody id="tree-list"><tr><td colspan="2" class="py-4 text-center text-gray-400">لا يوجد أشجار بعد..</td></tr></tbody>
            </table>
            <button id="logout-btn" class="mt-6 text-red-500 text-sm">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://slunnljduvspmghgzrlc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsdW5ubGpkdXZzcG1naGd6cmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTUxMDEsImV4cCI6MjA5Njc5MTEwMX0.LzNMNL4wKKCQFKds3_H3boc0FMPNX2qz646_eEfA-Pk';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // التبديل بين الواجهات
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        // تسجيل الدخول
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('auth-email').value,
                password: document.getElementById('auth-password').value
            });
            if (error) alert(error.message);
        });

        // تسجيل الخروج
        document.getElementById('logout-btn').onclick = () => supabase.auth.signOut();
    </script>
</body>
</html>

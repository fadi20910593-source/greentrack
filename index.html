<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولّد الـ QR الذكي للمزارع</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f9f4; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; text-align: right; box-sizing: border-box; }
        h2 { text-align: center; margin-bottom: 20px; color: #1b5e20; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        button { background-color: #2e7d32; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; font-weight: bold; }
        button:hover { background-color: #1b5e20; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>نظام GreenTrack الذكي 🌿</h2>
        
        <div class="form-group">
            <label for="treeType">🌳 نوع الشجرة:</label>
            <input type="text" id="treeType" placeholder="مثال: زيتون نبالي، تين أسود...">
        </div>

        <div class="form-group">
            <label for="graftingMethod">✂️ طريقة التطعيم / الترقيد:</label>
            <input type="text" id="graftingMethod" placeholder="مثال: ترقيد هوائي، تطعيم بالقلم...">
        </div>

        <div class="form-group">
            <label for="treeNotes">📝 ملاحظات إضافية:</label>
            <textarea id="treeNotes" placeholder="اكتب أي ملاحظات عن حالة الشجرة هنا..."></textarea>
        </div>
        
        <button onclick="handleFormSubmit()">توليد الـ QR Code الآن</button>        
        
        <div id="qrcode"></div>
    </div>

    <script>
        // دالة توليد الـ QR الحقيقية بناءً على الرابط المستلم من السيرفر
        function generateMyQR(actualURL) {
            // تنظيف أي كود قديم
            document.getElementById("qrcode").innerHTML = "";
            
            // تشغيل المكتبة لتوليد الكود بالرابط الحقيقي
            new QRCode(document.getElementById("qrcode"), {
                text: actualURL,
                width: 180,
                height: 180,
                colorDark : "#1b5e20", // لون الـ QR أخضر زراعي
                colorLight : "#ffffff"
            });
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      // بيانات مشروع GreenTrack الخاصة بك
      const SUPABASE_URL = 'https://slunnljduvspmghgzrlc.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_TcEUmD0fKlopTF2MgnQu4g_nf9ui0vs';

      // اتصال قاعدة البيانات
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // دالة وسيطة لجمع ما كتبه المزارع في الخانات وإرساله
      function handleFormSubmit() {
          const treeType = document.getElementById("treeType").value.trim();
          const method = document.getElementById("graftingMethod").value.trim();
          const notes = document.getElementById("treeNotes").value.trim();

          // التأكد أن المزارع أدخل البيانات الأساسية على الأقل
          if (!treeType || !method) {
              alert("رجاءً قم بتعبئة نوع الشجرة وطريقة التطعيم أولاً!");
              return;
          }

          // إرسال البيانات الحقيقية للدالة السحابية
          saveTreeToDatabase(treeType, method, notes);
      }

      async function saveTreeToDatabase(treeType, method, notes) {
        const { data, error } = await supabaseClient
          .from('trees')
          .insert([
            { 
              tree_type: treeType, 
              grafting_method: method, 
              notes: notes 
            }
          ])
          .select();

        if (error) {
          console.error('خطأ في حفظ البيانات:', error.message);
          alert('حدث خطأ أثناء الحفظ في السيرفر: ' + error.message);
        } else {
          console.log('تم حفظ الشجرة بنجاح في السيرفر السحابي!', data);
          const treeId = data[0].id;
          
          // الرابط الحقيقي للشجرة باستخدام الـ id الجديد
          const qrUrl = `https://fadi20910593-source.github.io/greentrack/?id=${treeId}`;
          
          // توليد الـ QR وعرضه فوراً أمام المزارع على الشاشة
          generateMyQR(qrUrl);
        }
      }
    </script>
</body>
</html>
